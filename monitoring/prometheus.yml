# Coleta das métricas do bot. O token fica em monitoring/metrics_token (mesmo valor de
# METRICS_TOKEN no .env, arquivo NÃO versionado, permissão 600).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aurora-bot
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['bot:9464']
