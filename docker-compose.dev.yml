# Só para desenvolvimento: publica Postgres e Lavalink no loopback para o bot rodar com `pnpm dev`.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres lavalink
# NÃO use em produção.
services:
  postgres:
    # Redes "internal" não publicam portas; em dev o Postgres entra também na rede egress.
    networks: [backend, egress]
    ports:
      - '127.0.0.1:5432:5432'
  lavalink:
    ports:
      - '127.0.0.1:2333:2333'
